name: Feature request
description: Suggest an idea or improvement
title: '[Feature]: '
labels: ['enhancement']

body:
  - type: markdown
    attributes:
      value: |
        Have a look at the [roadmap](https://github.com/zakaria17amir/Tracky#roadmap) first — it may
        already be planned.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        Describe the situation you run into, rather than the solution you have in mind. "I track
        weight and want to see it against sleep" says more than "add a scatter plot".
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Metrics
        - Entries / logging
        - Dashboards and widgets
        - Charts and visualization
        - Authentication / accounts
        - Admin
        - API
        - Documentation
        - Other
    validations:
      required: true
